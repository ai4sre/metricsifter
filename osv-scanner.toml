# osv-scanner configuration for `make vuln` (uv.lock). Every exception names
# one exact locked version, says why it cannot be updated, and expires so that
# it is reviewed again. A newer locked version is scanned normally.

[[PackageOverrides]]
# Python 3.10 fork of the dev/viz environment only (matplotlib -> pillow):
# Pillow 13, which fixes these advisories, requires Python >= 3.11, and Python
# 3.10 reached end of life in October 2026. metricsifter itself never imports
# Pillow. Drop this entry together with Python 3.10 support.
name = "pillow"
version = "12.3.0"
ecosystem = "PyPI"
vulnerability.ignore = true
effectiveUntil = 2027-05-01
reason = "Python 3.10-only dev/viz dependency; the fixed Pillow 13 requires Python >= 3.11"

[[PackageOverrides]]
# experiments extra only: the pinned PyRCA revision used to reproduce the
# paper requires scikit-learn < 1.2. It is installed only into the separate
# .venv-experiments environment, never by the dev extra or CI.
name = "scikit-learn"
version = "1.1.3"
ecosystem = "PyPI"
vulnerability.ignore = true
effectiveUntil = 2027-05-01
reason = "experiments extra pinned below 1.2 for the PyRCA revision of the paper; not installed by dev or CI"
