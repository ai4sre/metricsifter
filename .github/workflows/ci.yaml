name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly (Thursday 07:17 UTC): catches drift in uv, Python patch releases and
    # actions, and runs the exploratory property tests (the fuzz job).
    - cron: "17 7 * * 4"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install development dependencies
        run: uv sync --locked --extra dev --python 3.11

      - name: Verify lock file
        run: uv lock --check

      - name: Lint
        run: uv run --python 3.11 ruff check .

      - name: Check formatting
        run: uv run --python 3.11 black --check .

      - name: Type check
        run: uv run --python 3.11 mypy metricsifter tests

  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install development dependencies
        run: uv sync --locked --extra dev --python ${{ matrix.python-version }}

      - name: Test
        run: uv run --python ${{ matrix.python-version }} pytest -s -vv tests

  package:
    name: Build and smoke test package
    needs: [quality, test]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Build package
        run: uv build

      - name: Install and smoke test wheel outside the source checkout
        run: |
          WHEEL_PATH="$(find "$GITHUB_WORKSPACE/dist" -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$WHEEL_PATH"
          SMOKE_DIR="$(mktemp -d)"
          uv venv --python 3.11 "$SMOKE_DIR/.venv"
          uv pip install --python "$SMOKE_DIR/.venv/bin/python" "$WHEEL_PATH"
          cd "$SMOKE_DIR"
          "$SMOKE_DIR/.venv/bin/python" -c "import metricsifter; print(metricsifter.__version__)"
          "$SMOKE_DIR/.venv/bin/metricsifter" --help

  workflows:
    name: Lint and audit workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # actionlint runs through `go run` at the version pinned in the Makefile.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache: false

      # uvx runs zizmor at the version pinned in the Makefile.
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - name: actionlint and zizmor
        run: make lint-actions
        env:
          # Enables zizmor's online audits (impostor commits, known-vulnerable actions).
          GH_TOKEN: ${{ github.token }}

  fuzz:
    name: Property tests (exploratory)
    # The PR path already runs every property test deterministically (test job);
    # this job draws fresh random examples with a larger budget.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UV_PYTHON: "3.13"
      HYPOTHESIS_MAX_EXAMPLES: "5000"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install "$UV_PYTHON"

      - name: Explore the property tests
        run: make test-fuzz

      # The log has a @reproduce_failure decorator for each failure; the example
      # database replays it locally (copy it to .hypothesis/ and run make test-fuzz).
      - name: Keep the failing examples
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hypothesis-examples
          path: .hypothesis/
          include-hidden-files: true
          retention-days: 30
