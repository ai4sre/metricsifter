name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

# Permissions are granted per job. No concurrency group: a release run must
# never be cancelled half-way.
permissions: {}

jobs:
  validate-and-build:
    name: Validate and build distribution
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # No caches on the release path: a poisoned cache must not reach PyPI.
          enable-cache: false

      - name: Set up Python
        run: uv python install 3.11

      - name: Install development dependencies
        run: uv sync --locked --extra dev --python 3.11

      - name: Test
        run: uv run --python 3.11 pytest -s -vv tests

      - name: Lint
        run: uv run --python 3.11 ruff check .

      - name: Check formatting
        run: uv run --python 3.11 black --check .

      - name: Verify lock file
        run: uv lock --check

      - name: Verify tag matches the project version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PROJECT_VERSION="$(uv run --python 3.11 python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$TAG_VERSION" = "$PROJECT_VERSION"

      - name: Build package
        run: uv build

      - name: Install and smoke test wheel outside the source checkout
        run: |
          WHEEL_PATH="$(find "$GITHUB_WORKSPACE/dist" -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$WHEEL_PATH"
          SMOKE_DIR="$(mktemp -d)"
          uv venv --python 3.11 "$SMOKE_DIR/.venv"
          uv pip install --python "$SMOKE_DIR/.venv/bin/python" "$WHEEL_PATH"
          cd "$SMOKE_DIR"
          "$SMOKE_DIR/.venv/bin/python" -c "import metricsifter; print(metricsifter.__version__)"
          "$SMOKE_DIR/.venv/bin/metricsifter" --help

      - name: Store the validated distribution packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-package-distributions
          path: dist/

  publish-to-pypi:
    name: Publish to PyPI
    needs: validate-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: metricsifter_pypi
      url: https://pypi.org/p/metricsifter
    permissions:
      id-token: write # PyPI Trusted Publishing (OIDC) and attestations; no API token is stored

    steps:
      - name: Download the validated distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
