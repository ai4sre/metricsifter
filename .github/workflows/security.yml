name: Security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly (Tuesday 14:41 UTC): new advisories arrive without any code change.
    - cron: "41 14 * * 2"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # upload the results to code scanning
    strategy:
      fail-fast: false
      matrix:
        # Workflows are audited by zizmor (ci.yaml), not by CodeQL's actions language.
        language: [python]

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@v4.39.3
        with:
          category: /language:${{ matrix.language }}

  osv-scanner:
    name: Dependency vulnerabilities (osv-scanner)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # osv-scanner runs through `go run` at the version pinned in the Makefile.
      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.27.3"
          cache: false

      - name: Scan uv.lock
        run: make vuln
