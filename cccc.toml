# Configuration for cccc (https://github.com/moznion/cccc), which measures
# Cognitive and Cyclomatic Complexity. Read by cccc wherever it runs in this
# repository (for example `cccc --table --top-cognitive 20 .`) and by
# .github/workflows/complexity.yml; the cccc README documents every key.

# Measure hand-written production code only: tests, generated code and vendored
# sources would skew the distribution.
exclude = [
  "tests/**",        # tests
  "experiments/**",  # paper evaluation framework, not part of the package
]

# Fail when a function's cognitive complexity exceeds this: 15 is SonarSource's
# default. Split a function that exceeds it rather than raising the threshold.
max-cognitive = 15
